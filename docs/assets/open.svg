<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 296" width="470" height="296" role="img" aria-label="Two keycaps, option and V, are pressed and the Stash journal springs open.">
<title>Two keycaps, option and V, are pressed and the Stash journal springs open.</title>
<defs>
  <linearGradient id="wallL" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#8fb6e8"/><stop offset=".45" stop-color="#c9a7d9"/><stop offset="1" stop-color="#f2c6a0"/>
  </linearGradient>
  <linearGradient id="wallD" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#1d2a44"/><stop offset=".5" stop-color="#3a2346"/><stop offset="1" stop-color="#4a2f25"/>
  </linearGradient>
  <radialGradient id="blobWarm"><stop offset="0" stop-color="#f46a25" stop-opacity=".55"/><stop offset="1" stop-color="#f46a25" stop-opacity="0"/></radialGradient>
  <radialGradient id="blobCool"><stop offset="0" stop-color="#fff" stop-opacity=".40"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".20"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="shot" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#31b7c8"/><stop offset=".52" stop-color="#4f5cd8"/><stop offset="1" stop-color="#df5aa6"/>
  </linearGradient>
  <clipPath id="cardClip"><rect x="150" y="20" width="290" height="250" rx="18"/></clipPath>
  <filter id="frost" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
    <feGaussianBlur stdDeviation="12"/>
  </filter>
  <g id="deskBg">
    <rect class="lt" x="0" y="0" width="470" height="296" rx="16" fill="url(#wallL)"/>
    <rect class="dk" x="0" y="0" width="470" height="296" rx="16" fill="url(#wallD)"/>
    <ellipse cx="380" cy="276" rx="180" ry="130" fill="url(#blobWarm)"/>
    <ellipse cx="60" cy="24" rx="150" ry="100" fill="url(#blobCool)"/>
  </g>
  <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".16"/>
  </filter>
  <filter id="tileShadow" x="-40%" y="-40%" width="180%" height="180%">
    <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity=".26"/>
  </filter>
  <filter id="keyShadow" x="-40%" y="-40%" width="180%" height="190%">
    <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity=".20"/>
  </filter>
</defs>
<style>
svg {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  --surface:rgba(255,255,255,.74); --edge:rgba(255,255,255,.55);
  --ink1:rgba(0,0,0,.86); --ink2:rgba(0,0,0,.58); --ink3:rgba(0,0,0,.38);
  --ph:rgba(0,0,0,.05);
  --accent:#f46a25; --accentText:#d9561a; --accentSoft:rgba(244,106,37,.15);
  --key:#fff; --keyEdge:rgba(0,0,0,.16); --toast:rgba(0,0,0,.86);
}
@media (prefers-color-scheme: dark) {
  svg {
    --surface:rgba(28,28,30,.80); --edge:rgba(255,255,255,.12);
    --ink1:rgba(255,255,255,.90); --ink2:rgba(255,255,255,.58); --ink3:rgba(255,255,255,.38);
    --ph:rgba(255,255,255,.06);
    --accentText:#ff8a4c; --accentSoft:rgba(244,106,37,.24);
    --key:#48484c; --keyEdge:rgba(0,0,0,.55); --toast:rgb(70,70,72);
  }
  .lt{opacity:0} .dk{opacity:1}
}
.dk{opacity:0}
.t1{fill:var(--ink1)} .t3{fill:var(--ink3)}
.ph{fill:var(--ph)}
.ic3{fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;stroke:var(--ink3)}
.key{fill:var(--key);stroke:var(--keyEdge);stroke-width:1}
.b{font-weight:600}


#kOpt,#kV{transform-box:fill-box;transform-origin:50% 50%}
#kOpt{animation:kIn 5s infinite, pressA 5s infinite}
#kV{animation:kIn 5s infinite, pressB 5s infinite}
@keyframes kIn{0%{opacity:0}3%,20%{opacity:1}26%,100%{opacity:0}}
@keyframes pressA{0%,5%{transform:none}7%,10%{transform:translateY(3px) scale(.95)}13%,100%{transform:none}}
@keyframes pressB{0%,8%{transform:none}10%,13%{transform:translateY(3px) scale(.95)}16%,100%{transform:none}}
#kOptGlow{animation:glowA 5s infinite} #kVGlow{animation:glowB 5s infinite}
@keyframes glowA{0%,6%{opacity:0}7%,10%{opacity:1}14%,100%{opacity:0}}
@keyframes glowB{0%,9%{opacity:0}10%,13%{opacity:1}17%,100%{opacity:0}}
#card{transform-box:fill-box;transform-origin:6% 8%;animation:cardIn 5s infinite}
@keyframes cardIn{
  0%,11%{opacity:0;transform:translateY(12px) scale(.94);animation-timing-function:cubic-bezier(.2,.9,.25,1)}
  18%,95%{opacity:1;transform:none}
  99.5%,100%{opacity:0;transform:translateY(8px) scale(.97)}
}
/* the page starts every loop at zero, so it begins where the card is already flying in */
* { animation-delay: -1.2s !important }

@media (prefers-reduced-motion: reduce){ * {animation:none !important} #card{opacity:1} }
</style>
<use href="#deskBg"/>
  <g id="kOpt" filter="url(#keyShadow)">
    <rect class="key" x="14" y="117" width="56" height="56" rx="13"/>
    <rect id="kOptGlow" x="14" y="117" width="56" height="56" rx="13" fill="var(--accentSoft)"/>
    <g stroke="var(--ink1)" stroke-width="2.2" fill="none" stroke-linecap="round"><path d="M28,133 H36 L49,157 H57"/><path d="M48,133 H57"/></g>
  </g>

  <g id="kV" filter="url(#keyShadow)">
    <rect class="key" x="78" y="117" width="56" height="56" rx="13"/>
    <rect id="kVGlow" x="78" y="117" width="56" height="56" rx="13" fill="var(--accentSoft)"/>
    <text class="t1" x="106" y="154" text-anchor="middle" font-size="22" font-weight="600">V</text>
  </g>

<g id="card">
  <g clip-path="url(#cardClip)"><g filter="url(#frost)"><use href="#deskBg"/></g></g>
  <g filter="url(#cardShadow)">
    <rect x="150" y="20" width="290" height="250" rx="18" fill="var(--surface)"/>
  </g>
  <g clip-path="url(#cardClip)"><rect x="150" y="20" width="290" height="250" fill="url(#gloss)"/></g>
  <rect x="150" y="20" width="290" height="250" rx="18" fill="none" stroke="var(--edge)" stroke-width="1"/>
  <rect x="164" y="34" width="20" height="20" rx="5" fill="var(--accent)"/>
  <rect x="168.5" y="39" width="11" height="3.1" rx="1.55" fill="#fff" opacity=".95"/>
  <rect x="168.5" y="45" width="7.2" height="3.1" rx="1.55" fill="#fff" opacity=".72"/>
  <text class="t1" x="190" y="50" font-size="14" font-weight="800">Stash</text>
  <text class="t3 b" x="426" y="50" font-size="10" text-anchor="end">12/20</text>
  <text class="t3 b" x="166" y="76" font-size="10.5">Today</text>

  <g id="sel">
    <rect x="156" y="84" width="278" height="48" rx="8" fill="var(--accentSoft)"/>
    <rect x="150" y="93" width="3" height="30" rx="1.5" fill="var(--accent)"/>
  </g>

  <g id="row1">
    <rect class="ph" x="164" y="91" width="34" height="34" rx="7" filter="url(#tileShadow)"/><g class="ic3" transform="translate(173,101)"><path d="M1,2 h13 M1,6.5 h13 M1,11 h8"/></g>
    <text class="t1" x="208" y="105" font-size="12">hello@ozero.digital</text>
    <text class="t3" x="208" y="119" font-size="10">Text · 14:02</text>
  </g>
  <g id="row2">
    <rect x="164" y="143" width="34" height="34" rx="7" fill="url(#shot)" filter="url(#tileShadow)"/>
    <text class="t1" x="208" y="157" font-size="12">Screenshot 14.02</text>
    <text class="t3" x="208" y="171" font-size="10">Image · 1440 × 900</text>
  </g>
  <g id="row3">
    <rect class="ph" x="164" y="195" width="34" height="34" rx="7" filter="url(#tileShadow)"/><g class="ic3" transform="translate(173,205)"><path d="M6.4,9.6 a3.4,3.4 0 0 0 4.8,0 l2.4,-2.4 a3.4,3.4 0 0 0 -4.8,-4.8 l-1,1 M9.6,6.4 a3.4,3.4 0 0 0 -4.8,0 l-2.4,2.4 a3.4,3.4 0 0 0 4.8,4.8 l1,-1"/></g>
    <text class="t1" x="208" y="209" font-size="12">github.com/KiraMurano</text>
    <text class="t3" x="208" y="223" font-size="10">Text · 14:01</text>
  </g>
</g>
</svg>
