<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 264 72" width="264" height="72" role="img" aria-label="Download for macOS">
<title>Download for macOS</title>
<defs>
  <filter id="btn" x="-20%" y="-40%" width="140%" height="200%">
    <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#f46a25" flood-opacity=".45"/>
  </filter>
</defs>
<style>
svg{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif}
#arrow{transform-box:fill-box;transform-origin:50% 50%;animation:nudge 3.2s cubic-bezier(.4,0,.2,1) infinite}
@keyframes nudge{0%,62%{transform:none}70%{transform:translateY(3px)}80%,100%{transform:none}}
@media (prefers-reduced-motion: reduce){#arrow{animation:none}}
</style>
<g filter="url(#btn)"><rect x="14" y="10" width="236" height="44" rx="22" fill="#f46a25"/></g>
<g id="arrow" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path d="M40,23 V35 M35,31 L40,36 L45,31"/><path d="M34,40 H46"/>
</g>
<text x="60" y="38" font-size="15" font-weight="600" fill="#fff">Download for macOS</text>
</svg>
